name: MixedShop
options:
  bundleIdPrefix: io.reproof.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  ShopKit:
    path: Packages/ShopKit
targets:
  MixedShop:
    type: application
    platform: iOS
    sources: [MixedShop]
    dependencies:
      - package: ShopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reproof.example.mixedshop
        INFOPLIST_FILE: MixedShop/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  MixedShopTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Packages/ShopKit/Tests/ShopKitTests]
    dependencies:
      - package: ShopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.reproof.example.mixedshop.tests
        GENERATE_INFOPLIST_FILE: YES
