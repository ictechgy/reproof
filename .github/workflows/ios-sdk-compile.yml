name: iOS SDK compile and Foundation tests

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'live-ios/**'
      - 'reproof/source_snapshot*.py'
      - 'reproof/cli.py'
      - 'tests/test_source_snapshot*.py'
      - 'reproof/ios_launch.py'
      - 'tests/test_ios_launch*.py'
      - 'scripts/check-ios-launch-contract.py'
      - 'scripts/check-ios-observation-contract.py'
      - 'scripts/check-ios-snapshot-build.py'
      - 'reproof/ios_snapshot_observation.py'
      - 'reproof/ios_observation.py'
      - 'reproof/ios_instrumentation.py'
      - 'reproof/ios_cli.py'
      - 'reproof/ios_workspace.py'
      - 'tests/test_ios_snapshot*.py'
      - 'examples/native-logic-repair/**'
      - 'reproof/native_logic_repair_demo.py'
      - 'scripts/qa-native-logic-repair.py'
      - 'tests/test_native_logic_repair*.py'
      - 'reproof/project_repair.py'
      - 'reproof/ios_core.py'
      - 'reproof/ios_cases.py'
      - 'reproof/ticket_intake.py'
      - 'reproof/issue_package.py'
      - 'reproof/contracts/**'
      - 'reproof/execution/artifacts.py'
      - '.github/workflows/ios-sdk-compile.yml'
      - 'scripts/check-ios-sdk-export.py'
      - 'reproof/sdk_review.py'
      - 'reproof/ios_instrumentation_templates/**'
      - 'reproof/app_logs.py'
      - 'tests/test_ios_app_log_retry.py'
      - 'tests/test_ios_app_logs_runtime.py'
      - 'tests/fixtures/ios-app-logs/**'
      - 'tests/fixtures/ios-auto-runtime/**'
      - 'tests/release_inventory.json'
      - 'scripts/android-recovery-sandbox-probe.c'
      - 'scripts/release-check.py'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'live-ios/**'
      - 'reproof/source_snapshot*.py'
      - 'reproof/cli.py'
      - 'tests/test_source_snapshot*.py'
      - 'reproof/ios_launch.py'
      - 'tests/test_ios_launch*.py'
      - 'scripts/check-ios-launch-contract.py'
      - 'scripts/check-ios-observation-contract.py'
      - 'scripts/check-ios-snapshot-build.py'
      - 'reproof/ios_snapshot_observation.py'
      - 'reproof/ios_observation.py'
      - 'reproof/ios_instrumentation.py'
      - 'reproof/ios_cli.py'
      - 'reproof/ios_workspace.py'
      - 'tests/test_ios_snapshot*.py'
      - 'examples/native-logic-repair/**'
      - 'reproof/native_logic_repair_demo.py'
      - 'scripts/qa-native-logic-repair.py'
      - 'tests/test_native_logic_repair*.py'
      - 'reproof/project_repair.py'
      - 'reproof/ios_core.py'
      - 'reproof/ios_cases.py'
      - 'reproof/ticket_intake.py'
      - 'reproof/issue_package.py'
      - 'reproof/contracts/**'
      - 'reproof/execution/artifacts.py'
      - '.github/workflows/ios-sdk-compile.yml'
      - 'scripts/check-ios-sdk-export.py'
      - 'reproof/sdk_review.py'
      - 'reproof/ios_instrumentation_templates/**'
      - 'reproof/app_logs.py'
      - 'tests/test_ios_app_log_retry.py'
      - 'tests/test_ios_app_logs_runtime.py'
      - 'tests/fixtures/ios-app-logs/**'
      - 'tests/fixtures/ios-auto-runtime/**'
      - 'tests/release_inventory.json'
      - 'scripts/android-recovery-sandbox-probe.c'
      - 'scripts/release-check.py'

permissions:
  contents: read

jobs:
  compile-sdk:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify preinstalled official Xcode without installing tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version)" = $'Xcode 16.4\nBuild version 16F6'
          xcrun swift --version
          python_found=false
          for candidate in "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64/bin/python3 "$RUNNER_TOOL_CACHE"/Python/3.12.*/arm64/bin/python3; do
            if test -x "$candidate" && "$candidate" -c 'import sys; assert sys.version_info[:2] == (3, 12)'; then
              echo "REPRO_PYTHON=$candidate" >> "$GITHUB_ENV"
              python_found=true
              break
            fi
          done
          test "$python_found" = true
      - name: Compile public recovery sandbox probe without executing it
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/clang -Wall -Wextra -Werror scripts/android-recovery-sandbox-probe.c -o "$RUNNER_TEMP/reproof-sandbox-probe"
          test -s "$RUNNER_TEMP/reproof-sandbox-probe"
          shasum -a 256 "$RUNNER_TEMP/reproof-sandbox-probe"
          echo 'RECOVERY_SANDBOX_PROBE_COMPILED_NOT_EXECUTED'
      - name: Run synthetic Foundation tests and verify nonzero XCTest execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reproof-sdk-logs"
          export REPRO_SDK_TEST_EXPORT_DIRECTORY="$RUNNER_TEMP/reproof-sdk-synthetic-export"
          xcrun swift test --package-path ios/SDK --disable-automatic-resolution 2>&1 | tee "$RUNNER_TEMP/reproof-sdk-logs/swift-tests.log"
          grep -E 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/reproof-sdk-logs/swift-tests.log"
      - name: Verify snapshot-backed UIKit host contracts without native execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reproof-sdk-logs"
          "$REPRO_PYTHON" scripts/release-check.py --goal IOS_SNAPSHOT_CONTRACTS --effects filesystem,process \
            | tee "$RUNNER_TEMP/reproof-sdk-logs/ios-snapshot-contracts.json"
      - name: Verify local snapshot filesystem contracts without devices
        shell: bash
        run: |
          set -euo pipefail
          "$REPRO_PYTHON" scripts/release-check.py --goal SOURCE_SNAPSHOT_CONTRACTS \
            --effects filesystem,process \
            | tee "$RUNNER_TEMP/reproof-sdk-logs/source-snapshot-contracts.json"
      - name: Prove bounded sample Swift logic repair with the unchanged XCTest oracle
        shell: bash
        env:
          REPRO_NATIVE_LOGIC_OUTPUT: ${{ runner.temp }}/reproof-native-logic-results
        run: |
          set -euo pipefail
          "$REPRO_PYTHON" scripts/release-check.py --goal NATIVE_LOGIC_RUNTIME \
            --effects filesystem,process,native-compile \
            | tee "$RUNNER_TEMP/reproof-sdk-logs/native-logic-runtime.json"
      - name: Verify automatic app-log recovery and UIKit compile without running an app
        shell: bash
        run: |
          set -euo pipefail
          "$REPRO_PYTHON" scripts/release-check.py --goal IOS_APP_LOG_PUBLICATION \
            --effects filesystem,process,native-compile \
            | tee "$RUNNER_TEMP/reproof-sdk-logs/app-log-publication.json"
      - name: Validate exact Foundation writer bytes with unchanged sample-only host
        shell: bash
        run: |
          set -euo pipefail
          "$REPRO_PYTHON" scripts/check-ios-sdk-export.py --directory "$RUNNER_TEMP/reproof-sdk-synthetic-export" 2>&1 | tee "$RUNNER_TEMP/reproof-sdk-logs/host-compatibility.log"
      - name: Compile an independent public API consumer without running it
        shell: bash
        run: |
          set -euo pipefail
          xcrun swift build --package-path ios/SDK/Consumer --disable-automatic-resolution 2>&1 | tee "$RUNNER_TEMP/reproof-sdk-logs/consumer-build.log"
      - name: Compile unsigned sample Debug and Release for generic Simulator
        shell: bash
        run: |
          set -euo pipefail
          for configuration in Debug Release; do
            xcodebuild -project ios/Reproof.xcodeproj -scheme ReproSample \
              -configuration "$configuration" -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/reproof-sdk-$configuration" \
              -disableAutomaticPackageResolution -skipPackageUpdates \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              build 2>&1 | tee "$RUNNER_TEMP/reproof-sdk-logs/sample-$configuration.log"
          done
      - name: Execute synthetic approved launch parser vectors without a device
        shell: bash
        run: |
          set -euo pipefail
          "$REPRO_PYTHON" scripts/check-ios-launch-contract.py 2>&1 \
            | tee "$RUNNER_TEMP/reproof-sdk-logs/ios-launch-contract.log"
          grep -Fx 'iOS approved launch contract: 56 synthetic vectors passed' "$RUNNER_TEMP/reproof-sdk-logs/ios-launch-contract.log"
          grep -Fx 'iOS approved launch application: 4 synthetic launches passed' "$RUNNER_TEMP/reproof-sdk-logs/ios-launch-contract.log"
      - name: Execute synthetic observation v2 and v3 parser vectors without a device
        shell: bash
        run: |
          set -euo pipefail
          "$REPRO_PYTHON" scripts/check-ios-observation-contract.py 2>&1 \
            | tee "$RUNNER_TEMP/reproof-sdk-logs/ios-observation-contract.log"
          grep -Fx 'iOS observation contract: 60 synthetic vectors passed' "$RUNNER_TEMP/reproof-sdk-logs/ios-observation-contract.log"
      - name: Compile public snapshot-backed observation app without signing or device execution
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          "$REPRO_PYTHON" scripts/check-ios-snapshot-build.py --output "$RUNNER_TEMP/reproof-ios-snapshot-build" 2>&1 \
            | tee "$RUNNER_TEMP/reproof-sdk-logs/ios-snapshot-build.log"
          "$REPRO_PYTHON" - <<'PYSNAPSHOT'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = {'status': 'pass', 'compiledApps': 1, 'schemaVersion': 3,
                      'signed': False, 'deviceExecution': False, 'behaviorVerified': False}
          proof = json.loads((root / 'reproof-ios-snapshot-build/compile-proof.json').read_text())
          lines = (root / 'reproof-sdk-logs/ios-snapshot-build.log').read_text().splitlines()
          reports = [json.loads(line.removeprefix('IOS_SNAPSHOT_BUILD '))
                     for line in lines if line.startswith('IOS_SNAPSHOT_BUILD ')]
          assert len(reports) == 1
          for report in [proof, reports[0]]:
              assert type(report) is dict and set(report) == set(expected)
              assert all(type(report[key]) is type(value) and report[key] == value
                         for key, value in expected.items())
          print('Snapshot-backed v3 app compile proof verified; behavior remains unverified')
          PYSNAPSHOT
      - name: Compile unsigned Live helper without booting or running a Simulator
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project live-ios/ReproLive.xcodeproj -scheme ReproLive \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/reproof-live-helper" \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            2>&1 | tee "$RUNNER_TEMP/reproof-sdk-logs/live-helper-compile.log"
          "$REPRO_PYTHON" - <<'PYVERIFY'
          import os
          from pathlib import Path
          import plistlib
          root = Path(os.environ['RUNNER_TEMP']) / 'reproof-live-helper/Build/Products'
          products = root / 'Debug-iphonesimulator'
          host = products / 'ReproLiveHost.app'
          tests = products / 'ReproLiveTests-Runner.app/PlugIns/ReproLiveTests.xctest'
          for bundle, identifier, executable in (
              (host, 'io.reproof.live.host', 'ReproLiveHost'),
              (tests, 'io.reproof.live.tests', 'ReproLiveTests'),
          ):
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              assert info['CFBundleIdentifier'] == identifier
              assert info['CFBundleExecutable'] == executable
              binary = bundle / executable
              assert binary.is_file() and binary.stat().st_size > 0
          configs = list(root.glob('ReproLive_iphonesimulator*.xctestrun'))
          assert len(configs) == 1 and configs[0].is_file()
          assert type(plistlib.loads(configs[0].read_bytes())) is dict
          print('Live helper build products verified; no Simulator or app execution performed')
          PYVERIFY
      - name: Retain compile and executed-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sdk-compile-test-logs
          path: |
            ${{ runner.temp }}/reproof-sdk-logs/*.log
            ${{ runner.temp }}/reproof-sdk-logs/*.json
            ${{ runner.temp }}/reproof-ios-snapshot-build/compile-proof.json
            ${{ runner.temp }}/reproof-ios-snapshot-build/**/*.log
            ${{ runner.temp }}/reproof-native-logic-results/*-report.json
            ${{ runner.temp }}/reproof-native-logic-results/*/toolchain-*.log
            ${{ runner.temp }}/reproof-native-logic-results/*/baseline/*.log
            ${{ runner.temp }}/reproof-native-logic-results/*/baseline/*.xml
            ${{ runner.temp }}/reproof-native-logic-results/*/candidate/*.log
            ${{ runner.temp }}/reproof-native-logic-results/*/candidate/*.xml
          if-no-files-found: warn
          retention-days: 7
