name: Portable software checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0:
    name: G0 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Includes four explicit once-per-matrix synthetic scale proofs.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # This explicit inventory gate uses only the Python standard library.
      # Do not replace with discovery: other suites need native tools/devices.
      - name: Run required portable G0 checks
        run: python scripts/release-check.py --goal G0 --effects filesystem,process
      - name: Run portable runtime-resource checks
        run: python scripts/release-check.py --goal RUNTIME --effects filesystem,process
      - name: Run read-only CLI validation checks
        run: python scripts/release-check.py --goal CLI --effects filesystem,process
      - name: Run review-only locator proposal checks
        run: python scripts/release-check.py --goal LOCATOR --effects filesystem,process,loopback
      - name: Run bounded local source snapshot contracts
        run: python scripts/release-check.py --goal SOURCE_SNAPSHOT_CONTRACTS --effects filesystem,process
      - name: Measure synthetic enterprise source snapshot scale once
        if: matrix.python-version == '3.12'
        run: python scripts/release-check.py --goal SOURCE_SNAPSHOT_SCALE --effects filesystem,process
      - name: Run iOS snapshot observation host contracts without Xcode
        run: python scripts/release-check.py --goal IOS_SNAPSHOT_CONTRACTS --effects filesystem,process
      - name: Measure end-to-end synthetic iOS snapshot scale once without Xcode
        if: matrix.python-version == '3.12'
        run: python scripts/release-check.py --goal IOS_SNAPSHOT_SCALE --effects filesystem,process
      - name: Run Android snapshot observation host contracts without Gradle
        run: python scripts/release-check.py --goal ANDROID_SNAPSHOT_CONTRACTS --effects filesystem,process
      - name: Measure end-to-end synthetic Android snapshot scale once without Gradle
        if: matrix.python-version == '3.12'
        run: python scripts/release-check.py --goal ANDROID_SNAPSHOT_SCALE --effects filesystem,process
      - name: Run local snapshot G9 proposal contracts without build or AI
        run: python scripts/release-check.py --goal G9_SNAPSHOT_CONTRACTS --effects filesystem,process,loopback
      - name: Measure synthetic G9 large-source and inert-APK proposal scale once
        if: matrix.python-version == '3.12'
        run: python scripts/release-check.py --goal G9_SNAPSHOT_SCALE --effects filesystem,process,loopback
      - name: Run Android capture policy host contracts without native execution
        run: python scripts/release-check.py --goal ANDROID_CAPTURE_CONTRACTS --effects filesystem,process
      - name: Private unqualified Android recovery host contracts
        run: python scripts/release-check.py --goal ANDROID_RECOVERY_QUALIFICATION_CONTRACTS --effects filesystem,process
      - name: Run synthetic native-provider contract checks
        run: python scripts/release-check.py --goal NATIVE_CONTRACTS --effects filesystem,process
      - name: Run deployment preflight and loopback observation binding checks
        run: python scripts/release-check.py --goal PREFLIGHT --effects filesystem,process,loopback
      # Uses the runner's installed Node, without a browser or extra packages.
      - name: Run browser state and request contract checks
        run: python scripts/release-check.py --goal WEB_CONTRACTS --effects filesystem,process
      - name: Run project-scoped ticket reference workflow checks
        run: python scripts/release-check.py --goal TICKET_REFERENCES --effects filesystem,process,loopback
      - name: Run inert ticket intake and causal local demo checks
        run: python scripts/release-check.py --goal TICKET_INTAKE --effects filesystem,process
      - name: Run frozen native-logic input and result contracts without native execution
        run: python scripts/release-check.py --goal NATIVE_LOGIC_CONTRACTS --effects filesystem,process
      - name: Run frozen Android logic input and result contracts without Gradle execution
        run: python scripts/release-check.py --goal ANDROID-LOGIC-CONTRACTS --effects filesystem,process
      # Official PyPI build tooling only; not a runtime dependency or publish step.
      - name: Prepare pinned package-test builder
        run: |
          PIP_CONFIG_FILE=/dev/null python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple --only-binary=:all: --no-deps setuptools==84.0.0
      - name: Run isolated installed-package checks
        run: python scripts/release-check.py --goal PACKAGE --effects filesystem,process,loopback
