name: Portable software checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0:
    name: G0 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # This explicit inventory gate uses only the Python standard library.
      # Do not replace with discovery: other suites need native tools/devices.
      - name: Run required portable G0 checks
        run: python scripts/release-check.py --goal G0 --effects filesystem,process
      - name: Run portable runtime-resource checks
        run: python scripts/release-check.py --goal RUNTIME --effects filesystem,process
      - name: Run read-only CLI validation checks
        run: python scripts/release-check.py --goal CLI --effects filesystem,process
      - name: Run review-only locator proposal checks
        run: python scripts/release-check.py --goal LOCATOR --effects filesystem,process,loopback
