[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reproof"
version = "0.1.0"
description = "Self-hosted mobile QA platform: record issues, replay deterministically on Android/iOS, verify AI repairs against approved evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{name = "ictechgy"}]
keywords = ["mobile", "qa", "testing", "replay", "ios", "android", "reproduction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ictechgy/reproof"
Repository = "https://github.com/ictechgy/reproof"
Issues = "https://github.com/ictechgy/reproof/issues"

[project.scripts]
reproof = "reproof.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["reproof*"]
namespaces = false
