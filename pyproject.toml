[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproof"
version = "0.1.0"
description = "Recorded Android QA sessions, deterministic replay, and bounded repair verification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reproof = "reproof.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["reproof*"]
namespaces = false
